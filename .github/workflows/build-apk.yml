name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Init Capacitor
        run: |
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            npx cap init "사탐정복" com.satamjeongbok.app --web-dir www
          fi

      - name: Add Android project
        run: '[ -d android ] || npx cap add android'

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Allow camera for photo input
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MF" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MF"

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          if [ -f keystore/debug.keystore ]; then
            mkdir -p ~/.android
            cp keystore/debug.keystore ~/.android/debug.keystore
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: satamjeongbok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
