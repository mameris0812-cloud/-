name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 @capacitor/status-bar@6 pdfjs-dist@3.11.174
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/
          echo '{"appId":"com.sataam.jeongbok","appName":"사탐정복","webDir":"www","plugins":{"StatusBar":{"style":"LIGHT","backgroundColor":"#F0F2F8","overlaysWebContent":false}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Status bar color
        run: |
          sed -i 's|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item><item name="android:statusBarColor">#F0F2F8</item><item name="android:windowLightStatusBar">true</item>|' android/app/src/main/res/values/styles.xml
          grep statusBarColor android/app/src/main/res/values/styles.xml
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sataam-jeongbok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
