name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          mkdir -p www
          cp "$(find . -name '*.html' -not -path './node_modules/*' | head -n1)" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          echo '{"appId":"com.sataam.jeongbok","appName":"사탐정복","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sataam-jeongbok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
