<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>사탐정복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone = top bar + bottom tab bar; tablet (768px+) = left sidebar + wide content, concept tab becomes list/detail split */
:root{
  --bg:#F0F2F8;--surface:#FFFFFF;--surface2:#F5F6FB;--ink:#141B34;--sub:#59637E;--line:#DCE1EE;
  --acc:#3F4FD1;--acc-ink:#FFFFFF;--accsoft:#E6E9FC;
  --ok:#12805C;--oksoft:#DDF3EA;--no:#C23B3B;--nosoft:#FBE4E4;--warn:#8F5B00;--warnsoft:#FFF0D0;
  --shadow:0 1px 2px rgba(20,27,52,.06),0 6px 18px rgba(20,27,52,.05);
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:var(--font);
  --r:16px;
}
:root[data-sub="s"]{--acc:#0B7F78;--accsoft:#D7F0EC}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1322;--surface:#171F38;--surface2:#1C2544;--ink:#EAEFFA;--sub:#9AA6C4;--line:#2A3454;--acc:#8E9BFF;--acc-ink:#0E1322;--accsoft:#252E5E;--ok:#5FD3A3;--oksoft:#143A2E;--no:#FF8A8A;--nosoft:#44212A;--warn:#F2C45C;--warnsoft:#3A2E10;--shadow:none;color-scheme:dark}
  :root[data-sub="s"]:not([data-theme="light"]){--acc:#52D1C6;--accsoft:#123B3A}
}
:root[data-theme="dark"]{--bg:#0E1322;--surface:#171F38;--surface2:#1C2544;--ink:#EAEFFA;--sub:#9AA6C4;--line:#2A3454;--acc:#8E9BFF;--acc-ink:#0E1322;--accsoft:#252E5E;--ok:#5FD3A3;--oksoft:#143A2E;--no:#FF8A8A;--nosoft:#44212A;--warn:#F2C45C;--warnsoft:#3A2E10;--shadow:none;color-scheme:dark}
:root[data-theme="dark"][data-sub="s"]{--acc:#52D1C6;--accsoft:#123B3A}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.drop:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}

/* shell */
.app{min-height:100dvh}
.main{min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:500;color:var(--sub);font-size:14px;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.view{padding:6px 0 112px;max-width:760px;margin:0 auto}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--sub);font-size:11.5px;font-weight:500;border-radius:12px;position:relative}
.tabbar button.on{color:var(--acc);font-weight:700}
.tabbar button.on::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--acc)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--no);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

@media (min-width:768px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:32px}
  .bar,.tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));padding:24px 0;overflow:auto}
  .view{max-width:1180px;padding:28px 0 56px}
  .brand{font-size:16px}
  .side .seg{flex-direction:column}
  .side .seg button{text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--sub);font-weight:500;text-align:left;position:relative}
  .nav button:hover{background:var(--surface)}
  .nav button.on{background:var(--accsoft);color:var(--acc);font-weight:700}
  .nav .badge{position:static;margin-left:auto}
  .side-foot{margin-top:auto;display:grid;gap:8px}
}
@media (max-width:767px){.nav{display:none}.side-foot{display:none}}

.dot{width:10px;height:10px;border-radius:50%;background:var(--sub);flex:none}
.dot.e{background:#3F4FD1}.dot.s{background:#0B7F78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot.e{background:#8E9BFF}:root:not([data-theme="light"]) .dot.s{background:#52D1C6}}
:root[data-theme="dark"] .dot.e{background:#8E9BFF}:root[data-theme="dark"] .dot.s{background:#52D1C6}

/* type */
.eyebrow{font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--sub)}
.h1{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.3;letter-spacing:-.01em}
.h2{font-size:18px;font-weight:700;line-height:1.4}
.h3{font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.sub{color:var(--sub);font-size:14.5px}
.sec{margin-top:28px;display:grid;gap:12px}
.sec>.h3,.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;background:var(--accsoft);color:var(--acc);padding:3px 10px;border-radius:99px;margin-bottom:8px}
.tag.no{background:var(--nosoft);color:var(--no)}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;flex:none}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.kw{display:inline-block;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:2px 10px;font-size:13.5px;margin:0 6px 6px 0}

.btn{border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.btn.inv{background:var(--acc-ink);color:var(--acc);border-color:var(--acc-ink);font-weight:700}
.btn.ghost{background:none}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* home */
.hero{background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:22px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:6px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-family:var(--serif);font-size:25px;line-height:1.3;margin:4px 0 6px}
.hero p{opacity:.9;font-size:14.5px}
.hero .row{margin-top:14px}
.hero .btn{flex:none}
.ring{flex:none;position:relative;width:104px;height:104px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--sub)}
.week{display:flex;gap:6px;justify-content:space-between}
.week div{flex:1;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--sub)}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--acc-ink)}
.week i.on{background:var(--acc);border-color:var(--acc)}
.week i.today{border-color:var(--acc)}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit b{font-weight:500}
.unit small{color:var(--sub);font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;height:7px;background:var(--surface2);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.act .ico{width:40px;height:40px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:none}
.act div{min-width:0;flex:1}
.act b{display:block;font-weight:700}
.act small{color:var(--sub);font-size:13.5px;display:block}

/* learn */
.split{display:block}
@media (min-width:1100px){
  .split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
  .split .list{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px));overflow-y:auto;overflow-x:hidden;padding-right:4px}
}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start}
.list .ug{font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--sub);padding:12px 4px 2px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.li.on{border-color:var(--acc);background:var(--accsoft)}
.li div{flex:1;min-width:0}
.li b{display:block;font-weight:500;line-height:1.35}
.li small{color:var(--sub);font-size:12.5px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--acc-ink)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:46px}
.detail h2{font-family:var(--serif);font-size:28px;line-height:1.3;margin:2px 0 8px;letter-spacing:-.01em}
.detail .lead{font-size:16.5px;line-height:1.7}
.blk{margin-top:22px}
.blk>.h3{margin-bottom:8px}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pts li{display:flex;gap:12px;align-items:flex-start;line-height:1.65}
.pts i{flex:none;width:24px;height:24px;border-radius:8px;background:var(--accsoft);color:var(--acc);font-style:normal;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.call{border-radius:12px;padding:13px 15px;font-size:15.5px}
.call b{display:block;font-size:13px;letter-spacing:.04em;margin-bottom:2px}
.call.no{background:var(--nosoft)}.call.no b{color:var(--no)}
.call.ex{background:var(--accsoft)}.call.ex b{color:var(--acc)}
.call.tip{background:var(--warnsoft)}.call.tip b{color:var(--warn)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
th{background:var(--surface2);font-weight:700;font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap}
.dnav{display:flex;gap:10px;margin-top:22px}
.dnav .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--acc);font-weight:700;padding:8px 0;margin-bottom:6px}
@media (min-width:1100px){.back{display:none}}

/* quiz */
.setup{display:grid;gap:18px}
.field{display:grid;gap:8px}
.field>.h3{font-size:13.5px}
.q-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q-head .meter{flex:1}
.q-head small{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:500;white-space:nowrap}
.q-text{font-size:19px;font-weight:500;line-height:1.6;white-space:pre-line;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;line-height:1.55}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}.opt.ok .n{background:var(--ok);border-color:var(--ok);color:var(--acc-ink)}
.opt.no{border-color:var(--no);background:var(--nosoft)}.opt.no .n{background:var(--no);border-color:var(--no);color:var(--acc-ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oxrow .opt{flex-direction:column;align-items:center;text-align:center;font-weight:700;font-size:17px;padding:18px 10px;margin:0}
.oxrow .opt .n{width:44px;height:44px;font-size:22px}
.exp{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--accsoft);font-size:15.5px}
.exp .v{display:block;font-weight:700;margin-bottom:2px}
.exp .v.ok{color:var(--ok)}.exp .v.no{color:var(--no)}
.after{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.after .btn{flex:1 1 130px}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.1}
.wn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.wn p{font-size:15px;margin:4px 0}
.wn .q{font-weight:500;font-size:16px;white-space:pre-line}
.wn .mine{color:var(--no)}
.wn .ans{color:var(--ok);font-weight:700}
.wn .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wlist{display:grid;gap:10px}
@media (min-width:768px){.wlist.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}

/* QA */
.qa{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.qu,.qb{padding:9px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap;max-width:92%}
.qu{background:var(--accsoft);justify-self:end}
.qb{background:var(--surface2)}
.qrow{display:flex;gap:8px;align-items:flex-end}
.ta{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:46px}
.qrow .ta{flex:1}

/* photo */
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:28px 16px;background:var(--surface2);cursor:pointer;color:var(--sub)}
.drop b{color:var(--ink)}
.drop .ico{width:48px;height:48px;border-radius:14px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center}
.photo{display:grid;gap:14px}
@media (min-width:768px){.photo.has{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}
.preview{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:var(--surface2);display:block}
.an h4,.ah{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700;margin:16px 0 4px}
.ah span{width:22px;height:22px;border-radius:7px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:12.5px;flex:none}
.an p{font-size:15px;margin:3px 0;white-space:pre-wrap}
.an.clip{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.prow{display:flex;gap:12px;align-items:flex-start}
.prow>div{min-width:0;flex:1}
.empty{text-align:center;color:var(--sub);padding:40px 12px;display:grid;gap:6px;justify-items:center}
.empty b{display:block;color:var(--ink);font-size:18px}
.empty .btn{margin-top:10px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:768px){.toast{bottom:32px}}
.formgrid{display:grid;gap:10px}
.hr{height:1px;background:var(--line);margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 태블릿·완성도 보강 ---- */
.list>*,.split>*{min-width:0}
.runwrap{max-width:820px;margin:0 auto}
.tabbar button{font-size:11px}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.fld{display:grid;gap:6px}
.fld label{font-size:13.5px;font-weight:700;color:var(--sub)}
.msg{font-size:15px;padding:10px 14px;border-radius:12px;background:var(--surface2)}
.msg.ok{background:var(--oksoft);color:var(--ok)}.msg.no{background:var(--nosoft);color:var(--no)}
.lnk{color:var(--acc);font-weight:700}
.lb{display:inline-block;font-size:12.5px;font-weight:700;color:var(--acc);background:var(--accsoft);border-radius:6px;padding:1px 8px;margin-right:4px}.lb.c{color:var(--warn);background:var(--warnsoft)}
.ld{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--accsoft);margin:8px 0}

{t:"분배 정의의 기준",top:"사회 정의",tag:"분배 기준",kw:["업적","능력","필요","균등"],d:"무엇을 기준으로 나누느냐에 따라 분배 정의의 입장이 갈려요.",pts:["업적: 기여한 만큼 분배해요","능력: 능력에 따라 분배해요","필요: 필요가 큰 사람에게 더 분배해요","균등: 모두에게 똑같이 분배해요"],tbl:{h:["기준","장점","한계"],r:[["업적","노력과 성과를 인정해 동기를 줘요","출발선의 불평등을 무시해요"],["능력","효율성이 높아요","타고난 우연이 결과를 좌우해요"],["필요","약자를 보호해요","노동 의욕이 약해질 수 있어요"],["균등","평등을 실현해요","기여 정도를 무시해요"]]},cf:"한 기준만 고집하기보다 상황에 맞게 조화시키려는 입장이 많아요.",ex:"성과급은 업적, 기초 생활 수급은 필요에 따른 분배예요.",tip:"업적·능력·필요·균등 네 가지를 장단점과 함께 외워요."},
{t:"공동체주의",top:"사회 정의",tag:"롤스 비판",kw:["연고적 자아","공동선","샌델","매킨타이어"],d:"개인은 공동체 속에서 형성된다고 보고 공동선과 연대를 강조해요.",pts:["자아는 공동체와 무관하지 않은 연고적 자아예요","개인의 권리보다 공동선과 공동체의 덕을 강조해요","개인의 권리만 앞세우는 자유주의를 비판해요","공동체에 대한 연대 책임과 헌신을 강조해요"],tbl:{h:["구분","자유주의(롤스)","공동체주의"],r:[["자아","무연고적 자아","연고적 자아"],["우선","정의와 개인의 권리","공동선과 덕"]]},cf:"롤스의 무연고적 자아 가정을 비판하는 입장이에요.",ex:"마을 공동체를 위해 지역 행사에 참여해야 한다고 보는 태도예요.",tip:"공동체주의는 ‘연고’와 ‘공동선’에 주목하세요."},
{t:"시민 불복종",top:"사회 정의",tag:"정당화 조건",kw:["공익","비폭력","공개적","처벌 감수","최후 수단"],d:"정의롭지 못한 법이나 정책에 양심에 따라 공개적·비폭력적으로 저항하는 행위예요.",pts:["목적: 정의 실현과 법·정책의 개선(공익)이에요","방법: 공개적이고 비폭력적이어야 해요","법을 어긴 데 따른 처벌을 받아들여야 해요","합법적 수단을 모두 쓴 뒤의 최후 수단이어야 해요"],cf:"단순한 범법이나 폭력 시위와 달리 공익, 비폭력, 처벌 감수가 핵심이에요.",ex:"소로, 간디, 킹 목사의 저항이 대표적인 사례예요.",tip:"공익·공개·비폭력·처벌 감수·최후 수단"},
{t:"인공 임신 중절",top:"생명 윤리",tag:"생명권과 자기 결정권",kw:["태아의 생명권","자기 결정권","잠재적 인간"],d:"태아의 생명권과 여성의 자기 결정권이 충돌하는 문제예요.",pts:["반대: 태아도 인간 생명이므로 생명권을 지녀요","반대: 인간 생명은 어떤 경우에도 소중해요","찬성: 여성은 자기 몸에 대한 결정권을 가져요","찬성: 태아는 아직 독립적 인격체가 아니에요"],tbl:{h:["입장","근거"],r:[["반대","태아의 생명권, 인간 생명의 존엄"],["찬성","여성의 자기 결정권, 태아의 인격성 부정"]]},cf:"찬반 모두 ‘생명권 대 자기 결정권’의 충돌이라는 점을 기억해요.",ex:"태아도 사람이라고 보면 생명권 쪽 근거가 돼요.",tip:"반대는 생명권, 찬성은 자기 결정권으로 정리해요."},
{t:"안락사",top:"생명 윤리",tag:"죽음과 존엄",kw:["적극적 안락사","소극적 안락사","자발적","존엄한 죽음"],d:"회복 불가능한 환자의 고통을 줄이기 위해 죽음을 허용하는 문제예요.",pts:["적극적 안락사: 약물 투여 등으로 직접 죽음에 이르게 해요","소극적 안락사: 연명 치료를 중단하거나 보류해요","자발적 안락사: 환자의 동의가 있어요","찬성: 자기 결정권, 고통에서의 해방, 존엄한 죽음","반대: 생명의 존엄, 의사의 의무, 악용 가능성"],tbl:{h:["구분","적극적","소극적"],r:[["방법","직접 죽음을 초래","치료 중단·보류"],["논쟁","더 크게 반대","상대적으로 허용 주장 많음"]]},cf:"조력 자살은 환자가 스스로 죽도록 의사가 방법을 제공하는 것이에요.",ex:"연명 치료를 거부하는 사전 의사 결정은 소극적 안락사 논의와 연결돼요.",tip:"적극은 직접 개입, 소극은 치료 중단이에요."},
{t:"죽음의 기준",top:"생명 윤리",tag:"심폐사설과 뇌사설",kw:["심폐사설","뇌사설","장기 이식"],d:"무엇을 죽음의 기준으로 볼 것인지에 따라 두 입장으로 나뉘어요.",pts:["심폐사설: 심장과 호흡이 비가역적으로 멈추면 사망으로 봐요","뇌사설: 뇌 기능이 비가역적으로 정지하면 사망으로 봐요","뇌사는 장기 이식 논의와 밀접해요","반대 우려: 심장이 뛰는 사람을 사망으로 보는 것은 생명 경시일 수 있어요"],tbl:{h:["입장","기준"],r:[["심폐사설","심장·호흡 정지"],["뇌사설","뇌 기능의 비가역적 정지"]]},cf:"뇌사설을 따르면 심장이 뛰어도 사망으로 판단할 수 있어요.",ex:"장기 이식을 위해 뇌사 판정 기준을 논의하는 상황이에요.",tip:"심폐는 몸, 뇌사는 뇌로 기억해요."},
{t:"환경 윤리의 입장",top:"환경 윤리",tag:"자연을 보는 관점",kw:["인간 중심주의","동물 중심주의","생명 중심주의","생태 중심주의"],d:"도덕적 고려의 범위를 어디까지 넓히느냐에 따라 네 입장으로 나뉘어요.",pts:["인간 중심주의: 자연은 인간을 위한 도구적 가치를 지녀요","동물 중심주의: 고통을 느끼는 동물도 도덕적 고려 대상이에요","생명 중심주의: 모든 생명체는 그 자체로 가치가 있어요","생태 중심주의: 개별 생명보다 생태계 전체를 중시해요"],tbl:{h:["입장","대표","핵심"],r:[["인간 중심","데카르트·칸트","자연은 인간의 수단"],["동물 중심","싱어·레건","동물의 고통, 권리"],["생명 중심","슈바이처·테일러","생명 외경, 내재적 가치"],["생태 중심","레오폴드·네스","대지 윤리, 심층 생태주의"]]},cf:"칸트는 동물에 대한 직접적 의무를 부정하고, 간접적 의무만 인정해요.",ex:"숲 전체의 생태계를 지키기 위해 개발을 막자는 주장은 생태 중심주의예요.",tip:"인간 → 동물 → 생명 → 생태계 순서로 고려 범위가 넓어져요."},
{t:"동물 해방과 동물 권리",top:"환경 윤리",tag:"싱어와 레건",kw:["종 차별주의","이익 평등 고려","삶의 주체","내재적 가치"],d:"싱어는 공리주의로, 레건은 권리 이론으로 동물의 도덕적 지위를 설명해요.",pts:["싱어: 고통을 느끼는 능력(감응 능력)이 도덕적 고려의 기준이에요","싱어: 인간이라는 이유만으로 우대하는 종 차별주의를 비판해요","레건: 동물도 삶의 주체로서 내재적 가치와 권리를 지녀요","레건: 동물을 단순한 수단으로 이용하는 것에 반대해요"],tbl:{h:["구분","싱어","레건"],r:[["바탕","공리주의","권리 이론(의무론적)"],["기준","고통을 느끼는 능력","삶의 주체"],["핵심","이익 평등 고려","내재적 가치와 권리"]]},cf:"싱어는 이익을, 레건은 권리를 근거로 삼아요.",ex:"공장식 축산의 고통에 문제를 제기하는 주장이 이 입장이에요.",tip:"싱어는 고통, 레건은 삶의 주체예요."}],
qs:[
{id:"e1",t:"서양 윤리",lv:1,q:"“이익이 없더라도 약속은 지켜야 한다”고 주장하는 입장으로 가장 적절한 것은?",o:["칸트 의무론","벤담의 공리주의","결과론","상대주의"],a:0,e:"행위의 결과가 아닌 의무와 보편 법칙에 따르는 것이 의무론이에요."},
{id:"e2",t:"서양 윤리",lv:1,q:"쾌락에도 질적 차이가 있다고 본 사상가는?",o:["벤담","밀","칸트","아리스토텔레스"],a:1,e:"벤담은 쾌락을 양으로만 계산했고, 밀은 질적 차이를 인정했어요."},
{id:"e3",t:"서양 윤리",lv:1,q:"“지나침과 모자람 사이의 중용을 찾는 품성”을 강조한 입장은?",o:["의무론","공리주의","덕 윤리","계약론"],a:2,e:"덕 윤리는 행위보다 행위자의 품성과 습관을 중시해요."},
{id:"e4",t:"서양 윤리",lv:1,q:"공리주의가 도덕 판단의 기준으로 삼는 것은?",o:["행위의 동기","행위의 결과","신의 명령","관습"],a:1,e:"결과가 사회 전체의 행복을 늘리는지가 기준이에요."},
{id:"e5",t:"서양 윤리",lv:2,q:"칸트가 말한 정언 명령에 해당하는 것은?",o:["목적이 있을 때만 따르는 조건부 규칙","누구에게나 예외 없이 적용되는 무조건적 명령","행복을 늘리는 방법을 알려주는 규칙","사회 관습에 따른 행동 지침"],a:1,e:"정언 명령은 조건 없이 따라야 하는 보편 법칙이에요. 조건부 명령은 가언 명령이에요."},
{id:"e6",t:"서양 윤리",lv:2,q:"거짓말을 하면 다수가 큰 이익을 얻는 상황에서, 이를 허용할 수 있다고 보는 입장은?",o:["공리주의","칸트의 의무론","맹자의 사단설","순자의 성악설"],a:0,e:"결과가 사회 전체의 행복을 늘리면 허용될 수 있다고 보는 것은 공리주의예요."},
{id:"e7",t:"동양 윤리",lv:1,q:"공자가 강조한 핵심 덕목으로, 사랑과 배려를 뜻하는 것은?",o:["인(仁)","의(義)","예(禮)","지(智)"],a:0,e:"공자는 인을 핵심 덕으로, 예를 인을 실천하는 형식으로 봤어요."},
{id:"e8",t:"동양 윤리",lv:2,q:"인간의 본성이 선하다고 보고 사단을 확충해야 한다고 주장한 사상가는?",o:["순자","맹자","한비자","노자"],a:1,e:"맹자는 성선설, 순자는 성악설을 주장했어요."},
{id:"e9",t:"동양 윤리",lv:2,q:"“인위를 버리고 자연의 이치에 따라 살아야 한다”는 입장은?",o:["유교의 예치","도가의 무위자연","불교의 연기설","법가의 법치"],a:1,e:"노자가 말한 무위자연은 억지로 꾸미지 않고 도에 따르는 삶이에요."},
{id:"e10",t:"사회 정의",lv:2,q:"롤스가 정의의 원칙을 도출하기 위해 제시한 가상 상황은?",o:["자연 상태","원초적 입장","최소 국가","이상적 담화 상황"],a:1,e:"무지의 베일을 쓴 원초적 입장이에요. 이상적 담화 상황은 하버마스예요."},
{id:"e11",t:"사회 정의",lv:3,q:"노직의 입장으로 가장 적절한 것은?",o:["국가는 소유 권리를 침해하지 않는 최소 국가여야 한다","차등의 원칙에 따라 최소 수혜자의 이익을 극대화해야 한다","국가가 결과의 평등을 위해 적극 재분배해야 한다","구성원의 필요에 따라 분배해야 한다"],a:0,e:"노직은 소유 권리론과 최소 국가를 주장해요. 차등의 원칙은 롤스예요."},
{id:"e12",t:"서양 윤리",lv:3,q:"의무론과 공리주의를 비교한 설명으로 옳은 것은?",o:["의무론은 결과, 공리주의는 동기를 중시한다","의무론은 동기와 의무, 공리주의는 결과를 중시한다","둘 다 행위의 결과로 판단한다","둘 다 행위자의 품성을 중시한다"],a:1,e:"의무론은 동기와 의무, 공리주의는 결과가 기준이에요. 품성은 덕 윤리예요."},
{id:"e13",t:"동양 윤리",lv:1,q:"모든 존재가 서로 원인과 조건이 되어 의존한다는 불교의 가르침은?",o:["연기","중용","정명","호연지기"],a:0,e:"연기를 깨달으면 모든 존재를 소중히 여기는 자비의 실천으로 이어져요."},
{id:"e14",t:"동양 윤리",lv:1,q:"“사람의 본성은 악하므로 예(禮)를 통해 교화해야 한다”고 본 사상가는?",o:["맹자","순자","공자","노자"],a:1,e:"순자는 성악설을 바탕으로 예와 교육을 통한 교화를 강조했어요."},
{id:"e15",t:"동양 윤리",lv:1,q:"“임금은 임금답게, 신하는 신하답게”처럼 각자 이름에 걸맞은 역할을 해야 한다는 공자의 주장은?",o:["정명","무위","연기","좌망"],a:0,e:"정명은 이름과 실제가 일치하도록 각자의 역할을 다해야 한다는 뜻이에요."},
{id:"e16",t:"동양 윤리",lv:2,q:"장자가 제시한 마음 수양법으로, 외물과 차별을 잊고 정신의 자유에 이르는 것은?",o:["좌망","사단","거경","정혜쌍수"],a:0,e:"장자는 좌망과 심재로 편견을 비우고 정신적 자유(소요유)를 누릴 수 있다고 봤어요."},
{id:"e17",t:"생명 윤리",lv:2,q:"환자의 연명 치료를 중단하거나 보류하여 자연스럽게 죽음에 이르게 하는 안락사 유형은?",o:["적극적 안락사","소극적 안락사","조력 자살","자연사"],a:1,e:"소극적 안락사는 치료를 중단·보류하는 것이고, 적극적 안락사는 약물 투여 등으로 직접 죽음에 이르게 하는 거예요."},
{id:"e18",t:"생명 윤리",lv:2,q:"뇌 기능이 비가역적으로 정지한 때를 죽음의 기준으로 보는 입장은?",o:["심폐사설","뇌사설","자연사설","생물학적 결정론"],a:1,e:"뇌사설은 뇌 기능의 비가역적 정지를, 심폐사설은 심장과 호흡의 정지를 기준으로 봐요."},
{id:"e19",t:"환경 윤리",lv:1,q:"고통을 느끼는 능력을 기준으로 도덕적 고려의 대상을 동물까지 넓혀야 한다고 본 사상가는?",o:["싱어","칸트","레오폴드","노직"],a:0,e:"싱어는 이익 평등 고려 원칙에 따라 종 차별주의를 비판했어요."},
{id:"e20",t:"환경 윤리",lv:2,q:"생태계 전체의 안정과 아름다움을 보존하는 방향이 옳다는 ‘대지 윤리’를 제시한 인물은?",o:["테일러","레오폴드","슈바이처","레건"],a:1,e:"레오폴드의 대지 윤리는 대표적인 생태 중심주의 입장이에요."},
{id:"e21",t:"환경 윤리",lv:1,q:"모든 생명체가 삶에의 의지를 지니므로 생명을 외경해야 한다고 본 사상가는?",o:["슈바이처","벤담","아리스토텔레스","밀"],a:0,e:"슈바이처는 생명 외경 사상을 바탕으로 생명 중심주의를 대표해요."},
{id:"e22",t:"사회 정의",lv:2,q:"시민 불복종의 정당화 조건으로 옳지 않은 것은?",o:["공익을 목적으로 해야 한다","비폭력적 방법을 사용해야 한다","법에 따른 처벌을 받아들여야 한다","개인의 이익을 위해 은밀하게 행해야 한다"],a:3,e:"시민 불복종은 공익을 위해 공개적이고 비폭력적으로 행하며 처벌을 감수해야 해요."},
{id:"e23",t:"사회 정의",lv:2,q:"롤스의 ‘무연고적 자아’ 개념을 비판하고 공동체 속에서 형성되는 자아를 강조한 입장은?",o:["공동체주의","자유지상주의","공리주의","의무론"],a:0,e:"샌델과 매킨타이어 같은 공동체주의자는 연고적 자아와 공동선을 강조해요."},
{id:"e24",t:"사회 정의",lv:1,q:"각자가 기여한 정도에 따라 분배해야 한다는 분배 기준은?",o:["업적에 따른 분배","필요에 따른 분배","균등 분배","신분에 따른 분배"],a:0,e:"업적은 노력과 성과(기여)에 따라 분배하는 기준이에요."},
{id:"e25",t:"서양 윤리",lv:3,q:"다음 중 의무론에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?\nㄱ. 행위의 동기와 의무를 중시한다.\nㄴ. 결과가 좋다면 어떤 행위도 정당화된다고 본다.\nㄷ. 인간을 수단으로만 대해서는 안 된다고 본다.",o:["ㄱ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],a:1,e:"결과가 좋아도 의무를 어기면 옳지 않다고 보는 것이 의무론이라 ㄴ은 틀려요."},
{id:"e26",t:"동양 윤리",lv:3,q:"(가), (나)에 대한 설명으로 옳은 것은?\n(가) 사람은 누구나 선한 마음의 단서를 지니고 있다.\n(나) 사람의 본성은 악하므로 예로 교화해야 한다.",o:["(가)는 성악설의 입장이다","(나)는 사단을 확충해야 한다고 본다","(가)는 맹자, (나)는 순자의 입장이다","(가)와 (나)는 모두 인간 본성이 선하다고 본다"],a:2,e:"(가)는 성선설의 맹자, (나)는 성악설의 순자예요."},
{id:"e27",t:"서양 윤리",lv:1,q:"아리스토텔레스가 인간이 추구해야 할 최고선으로 본 것은?",o:["쾌락","에우다이모니아(행복)","부","명예"],a:1,e:"아리스토텔레스는 덕에 따른 활동을 통해 에우다이모니아(행복)에 이른다고 봤어요."},
{id:"e28",t:"서양 윤리",lv:1,q:"쾌락의 양을 강도와 지속성 등으로 계산할 수 있다고 본 사상가는?",o:["벤담","밀","칸트","롤스"],a:0,e:"벤담은 양적 공리주의를 주장해 쾌락을 계산할 수 있다고 봤어요."},
{id:"e29",t:"사회 정의",lv:2,q:"롤스의 차등의 원칙에 대한 설명으로 가장 적절한 것은?",o:["최소 수혜자에게 최대 이익이 되는 불평등만 허용한다","모든 분배 결과를 똑같이 만들어야 한다","능력이 높은 사람이 더 많이 가져야 한다","국가는 재분배를 해서는 안 된다"],a:0,e:"차등의 원칙은 사회적 약자인 최소 수혜자에게 최대 이익이 되는 경우에만 불평등을 허용해요."},
{id:"e30",t:"생명 윤리",lv:2,q:"인공 임신 중절에 반대하는 입장이 근거로 삼는 것으로 가장 적절한 것은?",o:["태아도 생명권을 지닌 존재라는 점","여성의 신체에 대한 자기 결정권","태아가 독립적 인격체가 아니라는 점","출산에 따르는 경제적 부담"],a:0,e:"반대 입장은 태아의 생명권을, 찬성 입장은 여성의 자기 결정권을 강조해요."},
{id:"e31",t:"윤리학 기초",lv:1,q:"도덕적 언어의 의미를 분석하고 도덕 판단의 정당화 문제를 다루는 윤리학은?",o:["규범 윤리학","메타 윤리학","기술 윤리학","실천 윤리학"],a:1,e:"메타 윤리학은 ‘선’ 같은 도덕 언어의 의미와 도덕 판단의 정당화를 분석해요."},
{id:"e32",t:"윤리학 기초",lv:1,q:"특정 사회의 도덕 관습을 가치 판단 없이 사실대로 서술하는 윤리학은?",o:["규범 윤리학","메타 윤리학","기술 윤리학","응용 윤리학"],a:2,e:"기술 윤리학은 도덕에 대한 사실을 그대로 서술해요. 옳고 그름의 기준은 규범 윤리학이 다뤄요."}]},
s:{name:"사회·문화",units:["사회 이론","연구 방법","문화","사회화·일탈","사회 집단과 역할","사회 계층"],cards:[
{t:"기능론",top:"사회 이론",tag:"거시 이론",kw:["유기체","안정","통합"],d:"사회를 각 부분이 기능을 수행해 유지되는 유기체로 봐요.",pts:["사회 질서와 안정을 강조해요","불평등도 기능적으로 필요하다고 설명해요","한계: 갈등과 급격한 변동 설명이 약해요"],cf:"갈등과 변동 설명은 갈등론이 강해요.",ex:"학교는 사회에 필요한 인재를 길러내고 배치해요.",tip:"기능론은 질서, 안정, 통합이에요."},
{t:"갈등론",top:"사회 이론",tag:"거시 이론",kw:["희소 자원","지배 집단","변동"],d:"희소한 자원을 둘러싼 집단 간 대립에 주목해요.",pts:["지배 집단이 권력과 자원을 차지해요","불평등과 사회 변동 설명에 강해요","한계: 사회 질서와 합의를 소홀히 봐요"],cf:"기능론과 같은 거시 이론이지만 질서 대신 갈등과 변동을 강조해요.",ex:"교육이 기존 계층 불평등을 재생산한다고 비판해요.",tip:"갈등론은 자원, 지배, 변동이에요."},
{t:"상징적 상호작용론",top:"사회 이론",tag:"미시 이론",kw:["상징","의미 해석","자아"],d:"개인 간 상호작용 속에서 의미가 만들어진다고 봐요.",pts:["같은 행동도 해석에 따라 의미가 달라져요","자아는 타인과의 상호작용으로 형성돼요","한계: 거시적 구조를 설명하기 어려워요"],cf:"세 이론 중 유일한 미시 이론이에요. 거시와 미시 구분 문제가 자주 나와요.",ex:"‘문제아’로 불리면 스스로도 그렇게 행동하게 될 수 있어요.",tip:"상호작용론은 의미, 해석, 자아예요."},
{t:"사회 이론 한눈에 비교",top:"사회 이론",tag:"종합 정리",kw:["거시","미시","비교"],d:"세 이론을 같은 기준으로 비교해 두면 선지 풀이가 쉬워져요.",pts:["기능론과 갈등론은 사회 구조를 보는 거시 이론이에요","상징적 상호작용론은 개인 간 상호작용을 보는 미시 이론이에요","같은 현상도 이론마다 해석이 달라요"],tbl:{h:["구분","기능론","갈등론","상징적 상호작용론"],r:[["수준","거시","거시","미시"],["사회","유기체, 상호 의존","집단 간 경쟁·대립","상호작용으로 형성"],["강조","질서·안정·통합","불평등·변동","의미 해석·자아"],["한계","갈등·변동 설명 약함","질서·합의 소홀","거시 구조 설명 어려움"]]},cf:"교육 문제도 기능론은 인재 배분, 갈등론은 불평등 재생산, 상호작용론은 교사와 학생의 상호작용으로 봐요.",ex:"학교 성적 경쟁을 세 관점으로 각각 설명해 보세요.",tip:"거시는 기능론과 갈등론, 미시는 상호작용론이에요."},
{t:"실증적·해석적 연구 방법",top:"연구 방법",tag:"방법론",kw:["가치 중립","양적 연구","질적 연구","이해"],d:"사회 현상을 법칙으로 설명할지, 의미를 이해할지에 따라 방법론이 나뉘어요.",pts:["실증적 방법론: 자연 현상처럼 사회 현상도 법칙을 발견할 수 있다고 봐요","실증적 방법론: 가치 중립적 태도와 양적 연구를 중시해요","해석적 방법론: 인간 행위에는 의미와 동기가 있다고 봐요","해석적 방법론: 이해를 통해 질적 연구(참여 관찰, 심층 면접)를 활용해요"],tbl:{h:["구분","실증적","해석적"],r:[["전제","자연·사회 현상은 유사해요","인간 행위에는 의미가 있어요"],["목표","법칙 발견, 설명, 예측","의미와 동기의 이해"],["태도","가치 중립","연구자의 주관 인정"],["방법","설문, 실험, 통계","참여 관찰, 심층 면접"]]},cf:"비판적 방법론은 사회의 모순을 비판하고 변혁을 지향해요.",ex:"청소년 스마트폰 사용 시간을 설문으로 통계 내면 실증적 연구예요.",tip:"실증은 설명, 해석은 이해로 기억해요."},
{t:"자료 수집 방법",top:"연구 방법",tag:"조사 방법",kw:["질문지법","면접법","참여 관찰법","실험법","문헌 연구법"],d:"연구 목적에 맞는 자료 수집 방법을 선택해야 해요.",pts:["질문지법: 많은 사람에게 단시간에 설문을 해요","면접법: 대상의 생각을 깊이 있게 파악해요","참여 관찰법: 집단에 직접 참여해 생생한 자료를 얻어요","실험법: 변수를 통제해 인과 관계를 검증해요","문헌 연구법: 기존 기록과 자료를 분석해요"],tbl:{h:["방법","장점","단점"],r:[["질문지법","많은 사람, 짧은 시간, 낮은 비용","응답 신뢰성, 깊이 부족"],["면접법","깊이 있는 파악, 융통성","시간·비용이 많이 들어요"],["참여 관찰법","행위의 맥락을 생생하게 이해","오래 걸리고 주관이 개입해요"],["실험법","변수 통제, 인과 검증","인위적 상황, 윤리 문제"],["문헌 연구법","과거 자료에 접근, 비용이 적어요","자료의 신뢰성 한계"]]},cf:"참여 관찰법은 직접 참여하고, 질문지법은 참여 없이 설문만 받아요.",ex:"전국 학생 1만 명의 진로 희망을 조사한다면 질문지법이 알맞아요.",tip:"질문지는 넓게, 면접은 깊게, 실험은 인과예요."},
{t:"문화의 의미와 속성",top:"문화",tag:"문화 이해",kw:["학습성","공유성","축적성","변동성","전체성"],d:"문화는 한 사회 구성원이 공유하는 생활 양식의 총체예요.",pts:["학습성: 태어난 뒤 학습으로 습득해요","공유성: 구성원이 함께 공유해요","축적성: 세대를 거쳐 쌓이고 전승돼요","변동성: 시간이 지나며 변해요","전체성: 문화 요소들이 서로 연결돼 있어요"],cf:"문화는 선천적 본능이 아니라 학습된 것이에요.",ex:"한글 사용은 학습성, 설날 풍습은 공유성과 축적성의 예예요.",tip:"학습·공유·축적·변동·전체"},
{t:"문화를 보는 태도",top:"문화",tag:"문화 이해",kw:["문화 상대주의","자문화 중심주의","문화 사대주의"],d:"다른 문화를 어떤 기준으로 보느냐에 따라 세 가지 태도로 나뉘어요.",pts:["문화 상대주의: 각 문화를 그 사회 맥락에서 이해해요","자문화 중심주의: 자기 문화만 우월하다고 봐요","문화 사대주의: 다른 문화를 우월하게 보고 자기 문화를 낮춰요"],tbl:{h:["태도","의미","문제점"],r:[["자문화 중심주의","자기 문화만 우월","타 문화 배척, 갈등"],["문화 사대주의","타 문화를 숭배","자기 문화 정체성 상실"],["문화 상대주의","맥락 속에서 이해","보편 윤리 문제에 무비판 우려"]]},cf:"문화 상대주의도 인권 침해까지 무조건 인정하는 것은 아니에요.",ex:"손으로 먹는 식사 문화를 그 지역의 환경 속에서 이해해 봐요.",tip:"자기 위, 남 위, 맥락 이해를 구분해요."},
{t:"문화 변동과 문화 지체",top:"문화",tag:"변동",kw:["발명·발견","직접 전파","간접 전파","자극 전파","문화 접변","문화 지체"],d:"문화는 내부의 발명·발견이나 외부의 전파로 변해요.",pts:["내재적 변동: 발명과 발견으로 일어나요","외재적 변동: 직접·간접·자극 전파로 일어나요","문화 접변의 결과: 동화, 융합, 공존","문화 지체: 물질 문화의 변화를 비물질 문화가 따라가지 못해요"],tbl:{h:["접변 결과","설명","예"],r:[["동화","한 문화가 흡수되어 고유성을 잃어요","이주민 2세가 주류 언어만 사용"],["융합","새로운 제3의 문화가 생겨요","퓨전 음식"],["공존","두 문화가 고유성을 유지해요","여러 민족 문화가 공존하는 도시"]]},cf:"문화 지체는 물질 문화 변화가 더 빠르고 비물질 문화가 뒤처지는 현상이에요.",ex:"신기술은 빠르게 퍼지지만 관련 법과 윤리는 늦게 따라오는 현상이에요.",tip:"동화는 흡수, 융합은 새 문화, 공존은 각자 유지예요."},
{t:"사회화",top:"사회화·일탈",tag:"개인과 사회",kw:["1차·2차 사회화","재사회화","예기 사회화","사회화 기관"],d:"사회의 가치와 규범을 배워 구성원이 되는 과정이에요.",pts:["1차는 가정 중심, 2차는 학교·직장 등이에요","재사회화: 새 환경에 적응하려고 기존 가치를 바꿔요","예기 사회화: 앞으로 속할 집단의 규범을 미리 학습해요","사회화 기관: 가정, 학교, 또래 집단, 직장, 대중 매체 등"],cf:"재사회화는 ‘바꾸는’ 것, 예기 사회화는 ‘미리 배우는’ 것이에요.",ex:"입사 전에 회사 문화를 미리 익히는 건 예기 사회화예요.",tip:"재는 바꾸기, 예기는 미리 배우기예요."},
{t:"일탈 이론",top:"사회화·일탈",tag:"일탈",kw:["아노미","차별 교제","낙인"],d:"일탈이 왜 생기는지를 설명하는 이론들이에요.",pts:["머튼의 아노미: 문화적 목표와 제도적 수단의 괴리","서덜랜드의 차별 교제: 일탈 집단과 접촉하며 학습","레머트·베커의 낙인: 낙인이 2차 일탈을 낳아요","머튼의 적응 유형: 동조·혁신·의례주의·도피주의·반역"],tbl:{h:["이론","핵심","계열"],r:[["아노미(머튼)","목표와 수단의 괴리","기능론"],["차별 교제(서덜랜드)","일탈 집단과 접촉하며 학습","상호작용론"],["낙인(레머트·베커)","낙인이 2차 일탈 유발","상호작용론"],["갈등론","불평등한 구조가 일탈 유발","갈등론"]]},cf:"아노미는 기능론, 낙인은 상징적 상호작용론 계열의 설명이에요.",ex:"한 번의 실수로 ‘문제아’ 낙인이 찍혀 더 엇나가요.",tip:"아노미=괴리, 차별 교제=학습, 낙인=꼬리표예요."},
{t:"사회 집단의 유형",top:"사회 집단과 역할",tag:"집단",kw:["1차 집단","2차 집단","공동 사회","이익 사회","준거 집단"],d:"집단은 접촉 방식, 결합 의지, 소속 여부 등에 따라 나뉘어요.",pts:["1차 집단: 대면적이고 정서적 유대가 강해요","2차 집단: 간접적이고 목적 중심이에요","공동 사회: 본질 의지로 결합해요(퇴니스)","이익 사회: 선택 의지로 결합해요","준거 집단: 행동과 판단의 기준이 되는 집단이에요(소속 여부 무관)"],tbl:{h:["기준","유형"],r:[["접촉 방식","1차 집단 / 2차 집단"],["결합 의지","공동 사회 / 이익 사회"],["소속감","내집단 / 외집단"],["판단 기준","준거 집단"]]},cf:"준거 집단은 반드시 소속된 집단일 필요가 없어요.",ex:"가족은 1차 집단이면서 공동 사회의 성격이 강해요.",tip:"1차는 정, 2차는 목적, 공동은 본질, 이익은 선택이에요."},
{t:"사회적 지위와 역할",top:"사회 집단과 역할",tag:"지위·역할",kw:["귀속 지위","성취 지위","역할 갈등","역할 긴장"],d:"지위는 사회에서의 위치, 역할은 그에 따른 행동 기대예요.",pts:["귀속 지위: 태어나면서 자동으로 주어지는 지위","성취 지위: 노력과 선택으로 얻는 지위","역할 갈등: 서로 다른 지위의 역할이 충돌해요","역할 긴장: 하나의 지위에 요구되는 역할들이 충돌해요"],tbl:{h:["구분","의미","예"],r:[["귀속 지위","태어나면서 주어져요","자녀, 연령"],["성취 지위","노력으로 획득해요","의사, 대학생"],["역할 갈등","다른 지위의 역할이 충돌","야근과 육아의 충돌"],["역할 긴장","한 지위 안의 역할이 충돌","담임의 상담자와 평가자 역할"]]},cf:"역할 갈등은 지위가 둘 이상, 역할 긴장은 지위가 하나예요.",ex:"직장에서의 야근과 집에서의 육아가 겹치면 역할 갈등이에요.",tip:"갈등은 지위가 둘, 긴장은 지위가 하나예요."},
{t:"사회 조직과 관료제",top:"사회 집단과 역할",tag:"조직",kw:["공식 조직","비공식 조직","관료제","탈관료제"],d:"규모가 큰 조직은 목표 달성을 위해 관료제 형태로 운영되는 경우가 많아요.",pts:["공식 조직: 명문화된 규칙과 직위 체계를 갖춰요","비공식 조직: 구성원 간 친분으로 자연스럽게 형성돼요","관료제: 위계, 분업, 규칙, 문서주의, 비인격성","장점: 효율성과 예측 가능성, 단점: 인간 소외와 경직성"],cf:"탈관료제는 수평적이고 유연한 조직을 지향해요.",ex:"대기업이나 정부 부처가 관료제의 전형적인 사례예요.",tip:"관료제는 규칙과 위계로 효율을 높이지만 경직되기 쉬워요."},
{t:"사회 계층 이론",top:"사회 계층",tag:"계층 설명",kw:["기능론","갈등론","마르크스","베버"],d:"계층이 왜 생기는지를 보는 관점이 이론마다 달라요.",pts:["기능론: 중요한 직위에 유능한 사람을 배치하려면 보상 차등이 필요해요","갈등론: 지배 집단이 자원을 독점해 불평등이 생겨요","마르크스: 생산 수단 소유 여부로 계급을 나눠요","베버: 계급(경제)·지위(위신)·권력(정치)의 다차원으로 설명해요"],tbl:{h:["구분","기능론","갈등론"],r:[["계층 발생","사회적 필요, 보상 차등","지배 집단의 자원 독점"],["불평등","필요하고 불가피","부당하며 극복할 대상"]]},cf:"베버는 계급 하나가 아니라 세 차원으로 계층을 설명해요.",ex:"의사의 높은 소득을 중요 직무에 대한 보상으로 보면 기능론이에요.",tip:"베버는 계급·지위·권력, 마르크스는 생산 수단이에요."},
{t:"계층 구조와 사회 이동",top:"사회 계층",tag:"이동",kw:["폐쇄적 계층","개방적 계층","세대 간 이동","세대 내 이동","구조적 이동"],d:"계층 구조는 이동 가능성에 따라 폐쇄적·개방적으로 나뉘어요.",pts:["폐쇄적 계층 구조: 신분과 출생이 지위를 좌우해요(카스트)","개방적 계층 구조: 능력과 노력으로 이동할 수 있어요","세대 간 이동: 부모와 자녀의 지위가 달라져요","세대 내 이동: 한 개인이 일생 동안 지위가 바뀌어요","구조적 이동: 산업 구조 변화로 많은 사람이 함께 이동해요"],tbl:{h:["구분","의미"],r:[["폐쇄적","신분·출생이 지위를 결정하고 이동이 어려워요"],["개방적","능력과 노력으로 이동할 수 있어요"],["세대 간","부모와 자녀의 지위가 달라요"],["세대 내","한 개인의 지위가 일생 동안 바뀌어요"]]},cf:"세대 간 이동과 세대 내 이동은 비교 대상이 부모와 자녀인지, 본인의 과거인지로 구분해요.",ex:"부모는 농부였지만 자녀가 의사가 되었다면 세대 간 이동이에요.",tip:"세대 간은 부모와 자녀, 세대 내는 본인의 일생이에요."}],
qs:[
{id:"s1",t:"사회 이론",lv:1,q:"“학교는 사회에 필요한 인재를 선발하고 배분한다”고 보는 관점은?",o:["기능론","갈등론","상징적 상호작용론","비판 이론"],a:0,e:"사회 각 부분의 기능과 안정을 강조하는 것은 기능론이에요."},
{id:"s2",t:"사회 이론",lv:1,q:"“교육이 기존 계층 구조를 재생산한다”고 비판하는 관점은?",o:["기능론","갈등론","문화 상대주의","자문화 중심주의"],a:1,e:"집단 간 자원 불평등과 지배 집단의 이익에 주목하는 것은 갈등론이에요."},
{id:"s3",t:"사회 이론",lv:1,q:"같은 행동도 상대가 부여하는 의미에 따라 달라진다고 보는 관점은?",o:["기능론","갈등론","상징적 상호작용론","구조주의"],a:2,e:"미시적 관점에서 해석과 의미 부여를 중시하는 이론이에요."},
{id:"s4",t:"문화",lv:1,q:"다른 문화를 그 문화의 맥락에서 이해하려는 태도는?",o:["자문화 중심주의","문화 사대주의","문화 상대주의","문화 절대주의"],a:2,e:"문화 상대주의는 각 문화의 환경과 역사 맥락을 존중해요."},
{id:"s5",t:"사회 이론",lv:2,q:"거시적 관점에서 사회 구조 전체를 분석하는 이론만 고른 것은?",o:["기능론, 갈등론","기능론, 상징적 상호작용론","갈등론, 상징적 상호작용론","상징적 상호작용론"],a:0,e:"기능론과 갈등론은 거시 이론, 상징적 상호작용론은 미시 이론이에요."},
{id:"s6",t:"사회화·일탈",lv:1,q:"개인이 사회의 가치와 규범을 학습해 구성원이 되는 과정은?",o:["사회화","일탈","사회 통제","문화 변동"],a:0,e:"사회화는 사회의 문화를 내면화해 사회 구성원이 되는 과정이에요."},
{id:"s7",t:"사회화·일탈",lv:2,q:"취업 준비생이 입사 전부터 그 회사의 조직 문화를 미리 익히는 것은?",o:["재사회화","예기 사회화","1차 사회화","탈사회화"],a:1,e:"앞으로 속할 집단의 규범을 미리 학습하는 것이 예기 사회화예요. 재사회화는 기존 가치를 바꾸는 거예요."},
{id:"s8",t:"사회화·일탈",lv:2,q:"일탈이 문화적 목표와 제도적 수단의 괴리 때문에 생긴다고 보는 이론은?",o:["머튼의 아노미 이론","레머트의 낙인 이론","서덜랜드의 차별 교제 이론","갈등론"],a:0,e:"목표와 수단의 괴리(아노미)로 일탈을 설명하는 것은 머튼의 이론이에요."},
{id:"s9",t:"사회화·일탈",lv:2,q:"한 번 비행을 저지른 학생이 ‘문제아’ 낙인 때문에 더 일탈하게 된다고 보는 관점은?",o:["낙인 이론","아노미 이론","기능론","차별 교제 이론"],a:0,e:"낙인이 2차 일탈을 낳는다고 보는 것이 낙인 이론이에요."},
{id:"s10",t:"문화",lv:2,q:"자기 문화를 기준으로 다른 문화를 열등하게 평가하는 태도는?",o:["문화 상대주의","자문화 중심주의","문화 사대주의","문화 다원주의"],a:1,e:"자문화 중심주의는 자기 문화만 우월하다고 봐요. 사대주의는 반대로 다른 문화를 우월하게 봐요."},
{id:"s11",t:"문화",lv:3,q:"외국 문화만 동경하며 자기 문화를 열등하게 여기는 태도는?",o:["자문화 중심주의","문화 사대주의","문화 상대주의","문화 융합"],a:1,e:"다른 문화를 우월하게 보고 자기 문화를 낮추는 것이 문화 사대주의예요."},
{id:"s12",t:"사회화·일탈",lv:3,q:"일탈의 원인을 개인이 아니라 사회의 불평등한 구조에서 찾으려는 관점은?",o:["갈등론","기능론","낙인 이론","차별 교제 이론"],a:0,e:"갈등론은 불평등한 자원 분배와 권력 구조가 일탈을 낳는다고 설명해요."},
{id:"s13",t:"연구 방법",lv:1,q:"자연 현상처럼 사회 현상도 가치 중립적으로 관찰해 법칙을 발견할 수 있다고 보는 연구 방법론은?",o:["실증적 연구 방법론","해석적 연구 방법론","비판적 연구 방법론","사변적 연구 방법론"],a:0,e:"실증적 방법론은 가치 중립과 양적 연구를 통해 일반 법칙을 찾으려 해요."},
{id:"s14",t:"연구 방법",lv:2,q:"인간 행위의 의미와 동기를 이해하는 것을 중시하고 참여 관찰과 심층 면접을 활용하는 연구 방법론은?",o:["실증적 연구 방법론","해석적 연구 방법론","양적 연구 방법론","통계적 연구 방법론"],a:1,e:"해석적 방법론은 의미와 동기를 이해하기 위해 질적 연구를 주로 사용해요."},
{id:"s15",t:"연구 방법",lv:1,q:"많은 사람에게 설문을 배포해 짧은 시간에 자료를 수집하기 쉬운 조사 방법은?",o:["질문지법","참여 관찰법","심층 면접법","문헌 연구법"],a:0,e:"질문지법은 대규모 조사에 유리하지만 응답의 깊이는 부족할 수 있어요."},
{id:"s16",t:"연구 방법",lv:2,q:"연구 대상 집단에 직접 들어가 함께 생활하며 행동을 관찰하는 조사 방법은?",o:["질문지법","참여 관찰법","실험법","문헌 연구법"],a:1,e:"참여 관찰법은 생생한 맥락을 얻을 수 있지만 시간이 오래 걸리고 주관이 개입할 수 있어요."},
{id:"s17",t:"연구 방법",lv:2,q:"독립 변수를 인위적으로 조작해 인과 관계를 검증하는 조사 방법은?",o:["실험법","질문지법","면접법","문헌 연구법"],a:0,e:"실험법은 변수를 통제해 인과 관계를 확인하기 좋아요."},
{id:"s18",t:"사회 집단과 역할",lv:1,q:"구성원 간 대면적이고 정서적 유대가 강한 집단은?",o:["1차 집단","2차 집단","이익 사회","준거 집단"],a:0,e:"가족, 친한 친구 모임이 1차 집단의 대표 사례예요."},
{id:"s19",t:"사회 집단과 역할",lv:2,q:"구성원이 이해관계와 목적 달성을 위해 선택 의지로 결합한 집단은?",o:["공동 사회","이익 사회","내집단","1차 집단"],a:1,e:"퇴니스는 본질 의지로 결합한 집단을 공동 사회, 선택 의지로 결합한 집단을 이익 사회라고 했어요."},
{id:"s20",t:"사회 집단과 역할",lv:2,q:"분업, 위계 구조, 규칙과 절차에 따라 운영되는 대규모 조직 형태는?",o:["관료제","탈관료제","비공식 조직","1차 집단"],a:0,e:"관료제는 효율성이 높지만 경직되고 인간 소외를 낳을 수 있어요."},
{id:"s21",t:"사회 계층",lv:1,q:"개인의 능력과 노력에 따라 계층 이동이 비교적 자유로운 계층 구조는?",o:["폐쇄적 계층 구조","개방적 계층 구조","신분 계층 구조","노예제 계층 구조"],a:1,e:"개방적 계층 구조에서는 성취 지위가 중요하고 이동 가능성이 높아요."},
{id:"s22",t:"사회 계층",lv:2,q:"부모가 농부였지만 자녀가 의사가 된 것처럼 부모와 자녀의 지위가 달라지는 이동은?",o:["세대 간 이동","세대 내 이동","수평 이동","구조적 이동"],a:0,e:"부모와 자녀 사이의 비교이므로 세대 간 이동이에요. 한 사람의 일생 변화는 세대 내 이동이에요."},
{id:"s23",t:"사회 이론",lv:3,q:"다음 중 갈등론의 관점에서 옳은 설명만을 고른 것은?\nㄱ. 사회 불평등은 지배 집단이 자원을 독점해 발생한다.\nㄴ. 사회 각 부분은 상호 의존하며 안정을 유지한다.\nㄷ. 사회 변동은 집단 간 갈등에서 비롯된다.",o:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],a:1,e:"ㄴ은 기능론의 설명이에요."},
{id:"s24",t:"사회화·일탈",lv:2,q:"이민자가 새 나라의 언어와 규범을 익히며 기존 생활 양식을 크게 바꾸는 과정은?",o:["재사회화","예기 사회화","1차 사회화","문화 지체"],a:0,e:"새로운 환경에 적응하기 위해 기존 가치와 생활 양식을 바꾸는 것이 재사회화예요."},
{id:"s25",t:"사회 집단과 역할",lv:1,q:"의사나 대학생처럼 개인의 노력과 선택으로 얻은 지위는?",o:["귀속 지위","성취 지위","역할 갈등","역할 긴장"],a:1,e:"노력과 선택으로 얻는 지위가 성취 지위이고, 태어나면서 주어지는 지위는 귀속 지위예요."},
{id:"s26",t:"문화",lv:2,q:"물질 문화의 변화 속도를 비물질 문화가 따라가지 못해 생기는 부조화 현상은?",o:["문화 지체","문화 융합","문화 동화","문화 공존"],a:0,e:"기술은 빠르게 변하지만 제도와 가치관은 천천히 변할 때 문화 지체가 나타나요."},
{id:"s27",t:"문화",lv:2,q:"두 문화가 섞여 새로운 제3의 문화가 형성되는 문화 접변의 결과는?",o:["문화 동화","문화 융합","문화 공존","문화 갈등"],a:1,e:"문화 융합은 새로운 제3의 문화가 만들어지는 거예요. 동화는 한 문화가 흡수되는 거예요."},

/* ---------- 퀴즈 ---------- */
function startRun(kind,ids,title){if(!ids.length){toast("풀 문제가 없어요");return}S.run={kind:kind,ids:shuffle(ids),i:0,pick:null,log:[],done:false,title:title||"",perm:{}};S.tab="quiz";S.qmode=kind;S.qa=null;S.rs=1;render()}
function startDaily(){var D=DB[S.sub],sc=D.qs.map(function(q){var h=st.qh[q.id],s=1;if(wrongAct(q.id))s=3;else if(!h)s=2;return{id:q.id,s:s+Math.random()*1.6}});sc.sort(function(a,b){return b.s-a.s});startRun("mc",sc.slice(0,5).map(function(x){return x.id}),"오늘의 5문제")}
function startUnit(i){var D=DB[S.sub],u=i?D.units[i-1]:"";S.qu=i;startRun("mc",D.qs.filter(function(q){return !u||q.t===u}).map(function(q){return q.id}).slice(0,0).concat(shuffle(D.qs.filter(function(q){return !u||q.t===u}).map(function(q){return q.id})).slice(0,10)),u?u+" 퀴즈":"전체 퀴즈")}
function startWrongQ(ui){var U=ui?DB[S.sub].units[ui-1]:"";var ids=st.wrong.filter(function(id){var z=byId(id);return z&&!st.und[id]&&DB[S.sub].qs.indexOf(z)>=0&&(!U||z.t===U)});startRun("mc",ids,"틀린 문제 다시 풀기")}
function startWrongX(){var ids=st.ox.filter(function(id){var z=oxById(id);return z&&!st.und[id]&&oxList(S.sub).indexOf(z)>=0});startRun("ox",ids,"틀린 선지 다시 풀기")}
function setQ(k,v){S[k]=v;render()}
function startSetup(){
  var D=DB[S.sub],u=S.qu?D.units[S.qu-1]:"",lv=S.ql;
  var pool=D.qs.filter(function(q){return(!u||q.t===u)&&(!lv||q.lv===lv)});
  if(S.qw)pool=pool.filter(function(q){return wrongAct(q.id)||!st.qh[q.id]});
  var n=S.qn?Math.min(S.qn,pool.length):pool.length;
  var ids=shuffle(pool.map(function(q){return q.id}));
  if(S.qw)ids.sort(function(a,b){return (wrongAct(b)?1:0)-(wrongAct(a)?1:0)});
  startRun("mc",ids.slice(0,n),(u||"전체")+" 퀴즈")}
function pickMC(i){var r=S.run;if(!r||r.pick!==null||r.kind!=="mc")return;var q=byId(r.ids[r.i]),ok=i===q.a;r.pick=i;rec(q.id,ok);
  if(ok){if(st.wrong.indexOf(q.id)>=0)st.und[q.id]=1}else{st.pk[q.id]=i;if(st.wrong.indexOf(q.id)<0&&!q.u)st.wrong.push(q.id);delete st.und[q.id]}
  r.log.push({id:q.id,ok:ok,p:i});save();render()}
function pickOX(v){var r=S.run;if(!r||r.pick!==null||r.kind!=="ox")return;var q=oxById(r.ids[r.i]),ok=v===q.a;r.pick=v;rec(q.id,ok);
  if(ok){if(st.ox.indexOf(q.id)>=0)st.und[q.id]=1}else{if(st.ox.indexOf(q.id)<0)st.ox.push(q.id);delete st.und[q.id]}
  r.log.push({id:q.id,ok:ok,p:v});save();render()}
function nextRun(){var r=S.run;S.qa=null;S.rs=1;if(r.i>=r.ids.length-1)r.done=true;else{r.i++;r.pick=null}render()}
function quitRun(){S.run=null;S.qa=null;S.rs=1;render()}
function askAll(id){S.qa={key:id,msgs:[],q:"각 선지가 왜 맞고 왜 틀린지 한 줄씩 설명해줘.",busy:false};sendQA()}

function gemErr(c,m){
  var t=c===0?"네트워크 오류예요. 인터넷 연결과 브라우저의 외부 요청 차단 여부를 확인해 주세요."

   :c===429?"사용 한도를 넘었어요. 잠시 후 다시 시도해 주세요."
   :c>=500?"Gemini 서버가 바쁜 것 같아요. 잠시 후 다시 시도해 주세요.":"오류가 났어요 ("+c+").";

function blobB64(b){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(",")[1])};r.onerror=no;r.readAsDataURL(b)})}

  if(o.files)for(var fi=0;fi<o.files.length;fi++)parts.push({inline_data:{mime_type:o.files[fi].type||"application/pdf",data:await blobB64(o.files[fi])}});

  var stream=!!(o.onText&&window.ReadableStream),ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},150000);

  try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:body,signal:ctl?ctl.signal:undefined})}
  catch(e){clearTimeout(tm);throw gemErr(e&&e.name==="AbortError"?-2:0)}

  }catch(e){clearTimeout(tm);throw gemErr(e&&e.name==="AbortError"?-2:0)}
